name: Docs check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check documentation consistency
        run: python3 scripts/check_docs.py
